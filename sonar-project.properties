# SonarQube Project Identification
sonar.projectKey=LevelHubAI
sonar.projectName=LevelHubAI
sonar.projectVersion=2.0.0

# Source & Test Directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Inclusions and Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/build/**,**/public/**,**/supabase/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/integrations/**

# Encoding & Language Settings
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.app.json
